<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDAS - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/images/nis.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">

    <div class="card login-card">
        <div class="card-body">
            <div class="text-center mb-4">
                <img src="assets/images/nis.png" alt="Logo" class="login-logo mx-auto mb-2">
                <h2 class="h3 fw-bold text-dark" id="loginTitle">REDAS Portal</h2>
                <p class="text-muted">Secure Access Gateway</p>
            </div>

            <form id="loginForm">
                <input type="hidden" id="targetRole" value="">
                <div class="mb-3">
                    <label for="serviceNumber" class="form-label fw-bold">Service Number / ID</label>
                    <input type="text" class="form-control form-control-lg" id="serviceNumber" placeholder="NIS/HQ/..." required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">Password</label>
                    <input type="password" class="form-control form-control-lg" id="password" placeholder="••••••••" required>
                </div>
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="text-success text-decoration-none" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-success w-100 btn-lg">Secure Login</button>
            </form>
        </div>
    </div>

    <footer class="mt-4 text-center text-muted small">
        &copy; 2026 Nigeria Immigration Service. All Rights Reserved. <br> <a href="index.html" class="text-decoration-none text-success">Back to Home</a>
    </footer>

    <!-- Forgot Password Modal -->
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Reset Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="resetPasswordForm">
                        <div class="mb-3">
                            <label for="resetServiceNumber" class="form-label">Service Number</label>
                            <input type="text" class="form-control" placeholder="NIS/XX/XXXX" required>
                        </div>
                        <div class="mb-3">
                            <label for="resetEmail" class="form-label">Email Address</label>
                            <input type="email" class="form-control" placeholder="officer@immigration.gov.ng" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" onclick="event.preventDefault(); alert('Reset link sent to email!');">Send Reset Link</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Dynamic Login Logic
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');
            const title = document.getElementById('loginTitle');
            const targetRoleInput = document.getElementById('targetRole');

            // Update UI based on selected module
            if (role === 'hq') {
                title.innerHTML = '<i class="fas fa-building me-2"></i>HQ Command Login';
                targetRoleInput.value = 'hq';
            } else if (role === 'zonal') {
                title.innerHTML = '<i class="fas fa-map me-2"></i>Zonal Command Login';
                targetRoleInput.value = 'zonal';
            } else if (role === 'state') {
                title.innerHTML = '<i class="fas fa-flag me-2"></i>State Command Login';
                targetRoleInput.value = 'state';
            } else if (role === 'cgis') {
                title.innerHTML = '<i class="fas fa-user-shield me-2"></i>CGIS Super Admin';
                targetRoleInput.value = 'cgis';
            }

            // Handle Login Submission
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const role = document.getElementById('targetRole').value;
                const btn = this.querySelector('button[type="submit"]');
                btn.innerText = 'Authenticating...';
                btn.disabled = true;

                setTimeout(() => {
                    if (role === 'hq') {
                        window.location.href = 'pages/dashboard-hq.html';
                    } else if (role === 'zonal') {
                        window.location.href = 'pages/dashboard-zonal.html';
                    } else if (role === 'state') {
                        window.location.href = 'pages/dashboard-state.html?command=lagos'; // Example redirect
                    } else if (role === 'cgis') {
                        window.location.href = 'pages/dashboard-hq.html';
                    } else {
                        window.location.href = 'pages/dashboard-hq.html'; // Default fallback
                    }
                }, 1500);
            });
        });
    </script>
</body>
</html>
